# keel —— main 分支的通用配置(所有 profile 共享)
#
# 完整方案见 docs/architecture.md;改这个文件前请先读 AGENTS.md 的"架构不变量"。
# 三个 profile 只负责"产物形态"(install / slot-a / slot-b),共用这里的全部内容。

[Config]
MinimumVersion=25
# 刻意**不**在这里设 Profiles= 默认值。
# 原因:mkosi 的集合型设置是"追加"语义。如果这里默认启用 install,
# 那么 `--profile slot-b` 会变成"install + slot-b"被解析两次,
# KernelCommandLine 里就会同时出现 root=PARTLABEL=root-a 和 root=PARTLABEL=root-b
# —— 静默产出一个 cmdline 自相矛盾的 UKI(本机实测确认过这个行为)。
#
# 防误构建的守卫放在两处(不能用 [Assert] Profiles=:[Assert] 在 mkosi.conf 里
# 是**在 profiles 之前**求值的,永远不满足):
#   1. mkosi.finalize —— 检查 $MKOSI_CONFIG 里 root=PARTLABEL 恰好出现一次;
#   2. tools/build.sh / tools/verify.sh —— 强制显式传一个产物 profile。

[Distribution]
Distribution=debian
Release=trixie
# amd64-microcode / intel-microcode / firmware-* 都在 non-free-firmware,
# 而 mkosi 的 Debian 后端只默认启用 main(见 AGENTS.md 已知的坑 #9)。
Repositories=non-free-firmware
# 可选:可复现构建。填一个 snapshot.debian.org 上的时间戳,
# 用 `mkosi latest-snapshot` 可以查最新可用快照。
#Snapshot=

[Output]
Format=disk
ImageId=keel
Output=keel
ManifestFormat=json
# 显式指定产物目录。
# 不写的话 mkosi 的规则是"mkosi.output/ 存在就用它,否则用当前目录" ——
# 那意味着产物落在仓库根目录还是子目录,取决于一个目录恰不存在,
# 而 tools/build.sh 必须知道去哪找产物。写死它。
OutputDirectory=mkosi.output
# A/B 更新载荷的来源:repart --split 的分区镜像 + UKI(见 docs/architecture.md §6)
SplitArtifacts=partitions,uki
CompressOutput=no

[Build]
# 宿主机只需要 mkosi + bubblewrap + 一个包管理器;
# ukify / systemd-repart / OVMF / qemu 全部由 tools tree 提供(见 AGENTS.md 坑 #10)。
ToolsTree=default
Incremental=yes
# 缓存目录也必须显式写:
# mkosi 的默认值同样是"mkosi.cache/ 存在才用它",而 mkosi 25.x 在
# Incremental=yes 且没有缓存目录时直接报错
#   "A cache directory must be configured in order to use --incremental"
# (27.x 有内建默认值,所以我们在开发环境里没撞上 —— 这是版本差异,不是配置错)。
# 写死之后两个版本行为一致,而且缓存留在仓库里 ⇒ 容器里构建也能复用。
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
# 工作目录也放进仓库,而不是默认的 /var/tmp:
# 在容器里构建时 /var/tmp 是容器自己的文件系统,而 mkosi.output/ 是 bind 进来的宿主机目录,
# 两者不同设备 ⇒ mkosi 收尾时无法 rename 产物,只能降级成"复制" 14 GiB 并打印一堆
# "Could not rename ... falling back to copying"(不致命,但白等很久)。
# 放进仓库后 rename 就能直接成功,顺带让缓存/工作目录跨容器调用复用。
WorkspaceDirectory=mkosi.workspace
# 显式要求 repart 走 offline 模式(不建 loop 设备)。
# mkosi 的默认值本来就是 yes,写出来是为了两件事:
#   1. 不依赖版本默认值(mkosi.conf 里其他地方已经因为这一点踩过两次:
#      Profiles= 的追加语义、CacheDirectory= 在 25.x 上必须显式配置);
#   2. 它是"能在容器里构建"的前提 —— --privileged 会把宿主机的 /dev 暴露进来,
#      repart 于是看得见 loop 设备却用不了,默认的 --offline=auto 不会回退,直接
#      报 "Failed to make loopback device ...: Device or resource busy"(见 AGENTS.md 坑 #17)。
# 我们不用 Subvolumes=,也不用 SELinux + XFS,所以不需要 online 模式。
RepartOffline=yes

[Runtime]
# 只影响 `mkosi vm` / `mkosi boot`,方便先在虚拟机里验证
RAM=2G
CPUs=2
