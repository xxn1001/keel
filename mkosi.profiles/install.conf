# 产物形态:安装镜像
#
# 完整磁盘:esp + root-a(有内容) + root-b(空槽) + data(骨架)。
# 它的 split 产物 keel.root-a.raw + keel.efi 同时充当"A 槽更新载荷",
# 所以一个版本只需要跑 install 和 slot-b 两次构建就能拿到两边的载荷
# (slot-a profile 仍然保留,用于对称地产出 A 槽载荷而不依赖安装镜像)。
[Output]
RepartDirectories=repart/install
Output=keel

[Content]
KernelCommandLine=root=PARTLABEL=root-a

[Output]
# ESP 里那个 UKI 叫什么(决策/坑 #44,2026-09 演练实测)
#
# mkosi 的默认格式是 `&e-&k`(= entry-token + 内核版本)⇒ 安装镜像的 ESP 里那份 UKI
# 实际叫 `keel-6.12.107+deb13-amd64.efi`,**不是** `keel-a.efi`。而 os-update / os-rescue /
# keel-confirm 全都按"槽名"找条目(`keel-a.efi` / `keel-b.efi`,
# 见 docs/architecture.md §5.3 与 lib.sh 的 keel_uki_path),于是"回滚"这一步
# 在一台刚装好的机器上必然失败:
#     os-update rollback → 找不到 /boot/EFI/Linux/keel-a.efi → 拒绝切换。
# (演练里就是这样:p1 更新成功、rollback 却什么也没做,p2 还停在槽 b。)
#
# 安装镜像里的那份 UKI **就是槽 a**(cmdline 里写死 root=PARTLABEL=root-a),
# 所以这里把格式钉成 `keel-a`;槽 b 的条目由 os-update 写 UKI 时自己命名(keel-b+3.efi)。
# 槽载荷 profile(slot-a/slot-b)不用改:它们产出的是**产物文件**,os-update 复制到 ESP 时
# 才决定条目名。
UnifiedKernelImageFormat=keel-a
