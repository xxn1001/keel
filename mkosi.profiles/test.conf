# 只在虚拟机 / 临时测试时**叠加**使用的 profile:
#
#     sudo mkosi --profile install --profile test vm
#
# 它打开 root 自动登录 —— 不需要密码就能进控制台。这是给"先在虚拟机里试"准备的
# (见 docs/install.md),真机上绝对不要用:main 的正常登录方式是用 SSH 密钥,
# 而 root 密码在镜像里默认没有设置。
#
# 注意:这个 profile 不改变产物形态(不带它也能构建),所以它必须和
# install / slot-a / slot-b 里的某一个一起用。
[Content]
Autologin=yes
