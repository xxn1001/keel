# 只在虚拟机 / 临时测试时**叠加**使用的 profile:
#
#     sudo tools/build-container.sh -p <临时密码> vm      # 推荐(宿主不被 mkosi 支持时走容器)
#     sudo mkosi --profile install --profile test --root-password=<临时密码> --force build
#     sudo mkosi --profile install --profile test --root-password=<临时密码> vm
#
# 它本身**不放设置** —— 存在只是为了给"虚拟机 / 临时测试"留一个稳定的名字,
# 以后要加 VM 专属的东西就加在这里(所以产物形态不受它影响,它必须和 install / slot-a / slot-b
# 里的某一个一起用)。
#
# ── root 密码从哪来 ────────────────────────────────────────────────
# 2026-09 改:**不再在仓库里硬编码密码**(之前是 `RootPassword=keel`)。
# 这是个公开仓库,写在 profile 里的密码等于公开的;而且加了密码才算"改变了配置"的话,
# 就会有人以为不带密码的产物不需要重建(见 AGENTS.md 坑 #23)。
# 现在密码只从命令行来:`tools/build-container.sh -p <密码>` → mkosi 的 `--root-password=`,
# 走 systemd 的 `passwd.hashed-password.root` credential,由 systemd-firstboot 在首启时应用 ——
# 和真机用仓库根目录 `mkosi.rootpw` 是**同一条路径**,所以在虚拟机里验证控制台登录 = 验证真机路径。
#
# 不加 `-p` 就是**没有密码**(root 锁定):这时进虚拟机只能靠 `authorized_keys` 里的公钥走 SSH。
#
# ⚠ mkosi 的 `vm` 不解析配置文件,它读上一次 build 的 history(见 AGENTS.md 坑 #30)
#   ⇒ 手工两条命令时,`--root-password=` 必须**两次都写**;`tools/build-container.sh vm -p …`
#   已经替你写了两遍。
#
# ── 为什么不用 Autologin=yes(坑 #26 / #28)────────────────────────
# 实测 `Autologin=yes` 在 Debian 13 + systemd 257 上会把 `serial-getty@hvc0.service` 变成
# "登录成功但 shell 秒退"的死循环(getty 每 2 秒重开一个登录提示,日志里从来不出现 shell 提示符),
# 而且这个循环会**顶掉**手动输密码的机会 ⇒ 一旦出现,控制台就废了。
# (根因是当时镜像里缺 `/bin/login`,已由坑 #28 修掉;但密码那条路既然走得通,就不回头碰 autologin。)
#
# 真机上**不要**用 `-p`:密码会进 shell 历史。真机用 `mkosi.rootpw`(已被 .gitignore 排除),
# 更推荐的是 SSH 公钥(`authorized_keys`),两者都见 docs/install.md §2.5。

[Content]
# 虚拟机专属的自检:把 machine-id / DHCP / 失败单元的证据打到**控制台**。
#
# 为什么需要它:验证是在容器里跑 `mkosi vm` 的,而容器里既没有 /dev/kvm 也连不进 guest
# (mkosi 的 VSock ssh 在容器里是坏的,坑 #27)⇒ 只能让 guest 自己喊出来。
# 详见 mkosi.extra-test/usr/lib/keel/selftest 开头那段注释。
#
# ExtraTrees= 是**集合型(追加语义)**:mkosi 的 mkosi.extra/ 仍然照常生效
# (手册:"If the mkosi.extra/ directory is found in the local directory it is also used
# for this purpose"),这里只是再叠一层。整个 mkosi.extra-test/ 只有 test profile 挂,
# 正式产物里不会出现自检脚本与单元。
ExtraTrees=mkosi.extra-test

