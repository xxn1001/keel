# 只在虚拟机 / 临时测试时**叠加**使用的 profile:
#
#     sudo mkosi --profile install --profile test vm
#
# 它给 root 设一个**已知的测试密码**,让你能在控制台敲进去(见 docs/install.md §1.2):
#
#     用户 root   密码 keel
#
# 为什么不是 Autologin=yes(原来那版):实测 `Autologin=yes` 在 Debian 13 + systemd 257 上
# 会把 `serial-getty@hvc0.service` 变成"登录成功但 shell 秒退"的死循环(getty 每 2 秒重开一个
# 登录提示,日志里从来不出现 shell 提示符),而且这个循环会**顶掉**手动输密码的机会。
# 密码方案走的是和真机完全一样的路径(systemd 的 passwd.hashed-password.root credential,
# 由 systemd-firstboot 在首启时应用),所以在虚拟机里验证它就等于验证真机的控制台登录路径。
#
# 真机上**不要**用这个 profile:密码是公开写在这里的。真机用仓库根目录的 `mkosi.rootpw`
# (自己的密码,已被 .gitignore 排除)或 SSH 公钥(推荐)。
#
# 注意:这个 profile 不改变产物形态(不带它也能构建),所以它必须和
# install / slot-a / slot-b 里的某一个一起用。
[Content]
RootPassword=keel
