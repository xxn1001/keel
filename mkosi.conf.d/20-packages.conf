# 装进镜像的软件包,以及构建后必须清掉的东西

[Content]
Packages=
    # 内核与模块
    linux-image-amd64
    # kmod 是必需的:没有 /sbin/modprobe 内核就无法按需加载任何模块
    # (网卡、overlayfs、nftables …),系统会变成一个只能跑内建驱动的砖
    kmod

    # init / 服务管理 / 引导 / 分区
    systemd
    systemd-sysv
    # Debian 把 systemd-boot 拆成了三个包,一个都不能少(AGENTS.md 已知的坑 #19):
    #   systemd-boot       集成与服务
    #   systemd-boot-efi   /usr/lib/systemd/boot/efi/{linuxx64.efi.stub,systemd-bootx64.efi}
    #                      ← 缺它 mkosi 无法生成 UKI("systemd-stub not found")
    #   systemd-boot-tools /usr/bin/bootctl
    #                      ← 缺它构建能过,但 keel-firstboot / keel-confirm / os-update
    #                        在运行时全都调不到 bootctl(启动后才暴露)
    systemd-boot
    systemd-boot-efi
    systemd-boot-tools
    systemd-repart
    systemd-resolved
    systemd-timesyncd

    # 微码:两个厂商都装,由 mkosi 自动前置进 UKI 的 initrd(不变量 8)
    amd64-microcode
    intel-microcode

    # 基础用户态
    bash
    coreutils
    util-linux
    kbd
    iproute2
    iputils-ping
    ca-certificates
    curl
    less
    nano
    # e2fsprogs 提供 resize2fs 与 mkfs.ext4:
    #   - 首启要把 volume 的文件系统扩到整盘(systemd-growfs 调 resize2fs);
    #   - os-install 要在目标盘上 mkfs.ext4。
    # 它也可能是别的包的依赖被带进来,但我们显式列出,免得哪天依赖链一变就悄悄没了。
    e2fsprogs
    # /bin/login + /etc/pam.d/login:Debian 13 把 login 拆成了独立包,
    # 少了它 agetty 会 exec 失败 ⇒ 控制台登录提示每两秒重开一次(AGENTS.md 坑 #28)
    login

    # 远程访问
    openssh-server

    # nix(决策 D7)
    nix-bin
    nix-setup-systemd

    # 固件:有线网卡、存储控制器等。桌面/无线固件属于 desktop profile。
    firmware-misc-nonfree

RemovePackages=
    # 运行时不留包管理器(决策 D10)。dpkg 保留 —— mkosi 生成 manifest 需要用它查询。
    apt
    apt-utils

RemoveFiles=
    # Debian 的 kernel postinst 会把内核与 initramfs 复制到 /boot,
    # 而 /boot 会被 repart 整体拷进 ESP(repart 的 CopyFiles=/boot:/)
    # ⇒ 不清掉的话 ESP 会被几百 MB 的无用文件塞满。
    # mkosi 自己负责造 initrd 和 UKI,这些文件一个都不需要。
    /boot/vmlinuz-*
    /boot/initrd.img-*
    /boot/System.map-*
    /boot/config-*
    /boot/*.old

    # SSH 主机密钥绝对不能烤进镜像 —— 否则所有装机实例共用同一套密钥。
    # openssh-server 的 postinst 在构建时会生成它们,这里删掉,
    # 首启由 keel-firstboot 用 ssh-keygen -A 重新生成(落到 /etc overlay 的 upper)。
    /etc/ssh/ssh_host_*
