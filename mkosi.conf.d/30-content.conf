# 镜像内容:内核命令行是这套设计的承重墙,别随手改
#
# 见 AGENTS.md 不变量 2/5 与 docs/architecture.md §5.1:
#   - ro 让根分区只读;
#   - **刻意不在这里挂 /data 和 ESP**(踩过坑 #24,真机实测):
#     cmdline 的 systemd.mount-extra 会在主系统里生成 .mount 单元,而这些单元
#     Requires/After /dev/disk/by-partlabel/*.device —— 也就是要等 udev;
#     主系统的 udev 又要等 systemd-sysusers,而 sysusers 需要可写的 /etc,
#     可写的 /etc 是本项目用 overlayfs 挂在 /data 上的 ⇒ 环形依赖,
#     systemd 打破环时丢掉 local-fs-pre.target,udev 被推到 emergency 之后,
#     所有 by-partlabel 挂载 90s 超时 ⇒ emergency mode。
#     现在:/data **和 ESP** 都由 keel-mounts.service 自己挂(扫 /sys 的 PARTNAME,
#     不依赖 udev;ESP 以 rw 挂到 /boot),systemd-gpt-auto-generator 被
#     `systemd.gpt_auto=no` 整个关掉(它挂 ESP 做得静默且不可靠,见坑 #36)。
#   - IOMMU 三件套对没有对应硬件的机器无害,是为将来 GPU 直通留的
#     "机器无关超集"示范(cmdline 烧在 UKI 里,运行时改不了,见 docs/traps.md 坑 #4)。
#
# 各 profile 会**追加**一行 root=PARTLABEL=root-<槽>(mkosi 的集合型设置是追加语义)。
[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=
    ro
    amd_iommu=on
    intel_iommu=on
    iommu=pt
    # 让 systemd-gpt-auto-generator 彻底退场(2026-09,坑 #36)。
    # 它对本系统唯一的贡献就是"自动挂 ESP",而这件事它做得**静默且不可靠**:
    # 装机后的系统上实测 ESP 压根没挂上,导致 os-status 看不到 UKI、os-update 写不进
    # 新 UKI、bootctl set-preferred 切不了槽 —— 而且每一步都"成功"。
    # 现在 ESP 和 /data 一样由 keel-mounts 扫 PARTNAME= 自己挂(lib.sh 的 keel_esp_mount),
    # gpt-auto 没有任何我们需要的功能(根分区 rw 重挂/扩容我们用不上,也没有单独的
    # /usr /home /srv /var 分区),所以直接关掉,免得它再悄悄插一手。
    # 见 docs/architecture.md §5.1 与 mkosi.extra/usr/lib/keel/mounts。
    systemd.gpt_auto=no
    # panic=-1:内核 panic 时**立即重启**(0 = 永不重启,负值 = 立刻重启)。
    #
    # 这是"自动回滚"能成立的前提(2026-09 演练确认,决策 D24 / 坑 #46):
    # 回退靠的是"候选槽那次启动失败了,下次启动自然回到旧槽"—— 而"下次启动"必须**真的发生**。
    # 没有这一行时,panic 会让机器停在黑屏等人按电源键:一次失败变成一次停机,
    # 而 A/B 的承诺是"新版本起不来就自己退回旧版本"。
    # 代价:panic 现场一闪而过(串口/屏幕上来不及看)。真要留证据得靠 pstore/ramoops,
    # 那是以后的事;日常排错靠"起不来的那次启动在 journal 里留下的东西 + os-status 的
    # last_result=failed + ESP 上被改名成 .failed 的 UKI"来定位。
    panic=-1

# 每个槽一个完整 UKI(内核 + initrd + 微码 + root=),不变量 3
UnifiedKernelImages=yes

# ---------------------------------------------------------------------------
# 系统标识:主机名 / 时区 / locale(决策 D22)
#
# 这三个由 mkosi 在**构建期**调用 `systemd-firstboot --root=<镜像树> --force` 落成
# /etc/hostname、/etc/localtime、/etc/locale.conf(mkosi 源码 run_firstboot()),所以
# 它们和别的 /etc 内容一样在只读的 lower 里;机器专属的改动仍然走 /etc overlay。
# mkosi.finalize 会逐个回读断言 —— 这三件事"退出码 0"什么也证明不了(坑 #29 的教训)。
#
# locale 用 C.UTF-8:不装 locales 包、不生成任何 locale 数据,而 glibc 自带 C.UTF-8,
# 中文文件名/UTF-8 输出照常。要改成 zh_CN.UTF-8 得额外装 locales 并 localedef,
# 那是 desktop profile 的事。
#
# ⚠ 时区依赖 /usr/share/zoneinfo ⇒ **tzdata 必须在包清单里**(它既不是 Essential,
#   也不会被 systemd 依赖带进来;少了它时区会静默落回 UTC —— 见 20-packages.conf)。
#
# ⚠ 在虚拟机里查时区不能作为证据:mkosi 的 qemu.py 会往 guest 注入
#   firstboot.timezone=<宿主时区> 与 firstboot.locale=C.UTF-8 两个 credential。
#   真正的判据是 /etc/localtime 指向哪(见 mkosi.finalize 的断言与 os-status)。
Hostname=keel
Timezone=Asia/Shanghai
Locale=C.UTF-8
