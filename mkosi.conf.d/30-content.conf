# 镜像内容:内核命令行是这套设计的承重墙,别随手改
#
# 见 AGENTS.md 不变量 2 与 docs/architecture.md §5.1:
#   - ro 让根分区只读;
#   - 两条 systemd.mount-extra 让 initrd 在 switch_root **之前**挂好 /Volume 和 ESP,
#     这样指向 /Volume 的符号链接从用户空间第一个瞬间起就有效
#     (符号链接无法参与挂载顺序约束,挂在后面就晚了);
#   - IOMMU 三件套对没有对应硬件的机器无害,是为将来 GPU 直通留的
#     "机器无关超集"示范(cmdline 烧在 UKI 里,运行时改不了,见 AGENTS.md 坑 #4)。
#
# 各 profile 会**追加**一行 root=PARTLABEL=root-<槽>(mkosi 的集合型设置是追加语义)。
[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=
    ro
    systemd.mount-extra=PARTLABEL=volume:/Volume:ext4:rw,noatime
    systemd.mount-extra=PARTLABEL=esp:/efi:vfat:ro
    amd_iommu=on
    intel_iommu=on
    iommu=pt

# 每个槽一个完整 UKI(内核 + initrd + 微码 + root=),不变量 3
UnifiedKernelImages=yes
