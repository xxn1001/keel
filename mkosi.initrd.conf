# 默认 initrd 的额外配置
#
# ⚠⚠ 2026-09-28 实测(坑 #76):**mkosi 25.3 根本不读这个文件** —— 源码里没有这个名字,
#   默认 initrd 是用内置的 `--include=mkosi-initrd` 构建的。也就是说下面这些设置
#   (尤其是 ExtraTrees=mkosi.extra-initrd)**从来没有生效过**:initrd 里既没有我们的
#   看门狗配置,也没有 softdog,坏槽在 initrd 阶段冻结时永远没人复位(坑 #50 的现场)。
#   现在真正生效的是 mkosi 的 `Initrds=` / `--initrd`:`tools/mkinitrd-extra.sh` 把
#   mkosi.initrd-extra/ 打成 cpio,build.sh 用 --initrd 拼进 UKI 的 .initrd。
#   这个文件保留只是为了记录脚本设置(脚本自身的防呆仍然有效),别再往这里加东西。
#
# 原来的说明:
# 为什么需要这个文件:mkosi 的脚本类设置(SyncScripts/PrepareScripts/BuildScripts/
# PostInstallationScripts/FinalizeScripts/PostOutputScripts/CleanScripts)默认值是按
# "源目录里有没有 mkosi.<名字> 文件"解析的,而默认 initrd 镜像与主镜像共用同一个源目录。
# 不显式清空的话,mkosi.postinst / mkosi.finalize 有可能被作用到 initrd 上 ——
# 而我们的 finalize 会把 /var /root 换成指向 /data 的符号链接(并给 /home /nix 建空目录),
# 那会把 initrd 弄坏,且报错会非常莫名其妙(见 docs/traps.md 坑 #1)。
#
# 两个脚本自身也带了 `[ -f "$BUILDROOT/etc/initrd-release" ] && exit 0` 的防护,
# 这里是第二道保险。
[Content]
# initrd 也需要看门狗配置(决策 D25 / 坑 #50):**冻结的是 initrd 里的 PID1** ——
# 候选槽的根镜像坏掉时它会停在 "Switch root target contains no usable init." 不动,
# 那时只有看门狗能把机器复位,自动回退才有机会发生。
# 注意 initrd **不读主镜像的 /etc**(mkosi 的 mkosi.extra/ 不进 initrd),
# 所以这份配置单独放在 mkosi.initrd-extra/ 里,经 tools/mkinitrd-extra.sh → mkosi --initrd
# 拼进 UKI 的 .initrd(v1.2 3.0 实测的可用路径;见 docs/traps.md #76)。
ExtraTrees=mkosi.initrd-extra
SyncScripts=
PrepareScripts=
BuildScripts=
PostInstallationScripts=
FinalizeScripts=
PostOutputScripts=

[Output]
# initrd 不需要额外的工件
SplitArtifacts=
ManifestFormat=
