# B 槽(空槽)
#
# 刻意用 Type=linux-generic 而不是 root 类型:镜像里同时存在两个 root 类型分区
# 会让 mkosi 的"哪个是 root 分区"判定产生歧义(见 AGENTS.md 已知的坑 #6)。
# 槽的身份只靠 PARTLABEL=root-b,更新时往这个分区写新版本。
#
# 安装镜像里就把这个槽建好(空 ext4),代价是镜像大 6 GiB,
# 换来的是装完立刻能测试槽切换,不需要任何分区手术(docs/architecture.md §3.2)。
[Partition]
Type=linux-generic
Format=ext4
Label=root-b
SizeMinBytes=6G
SizeMaxBytes=6G
SplitName=root-b
