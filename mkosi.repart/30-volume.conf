# /Volume:唯一的分区级可写状态
#
# 分区类型刻意用一个**项目私有 UUID**,而不是 Discoverable Partitions 里的
# linux-generic。两个原因:
#   1. 首启扩容要往目标盘跑一次 systemd-repart,而 repart 是按**类型**把现有分区
#      匹配到定义的 —— 如果 volume 也是 linux-generic,它会和同样是 linux-generic
#      的 root-b 撞车,可能扩错分区;
#   2. systemd-gpt-auto-generator 不会去碰它(我们靠 cmdline 的
#      systemd.mount-extra=PARTLABEL=volume 显式挂载)。
#
# 骨架来自镜像里的 /usr/share/keel/volume-skeleton,由 mkosi.finalize 生成
# (镜像自己的 /var 快照 + 补齐的必要目录,见 docs/architecture.md §4.2)。
[Partition]
Type=d605065b-64f9-4a07-a0b8-70963175c6e6
Format=ext4
Label=volume
CopyFiles=/usr/share/keel/volume-skeleton:/
SizeMinBytes=1G
# 不设 SizeMaxBytes ⇒ 在目标盘上占满剩余空间
GrowFileSystem=yes
# 注意(AGENTS.md 已知的坑 #14):这个设置只是给分区打一个 GPT 标志位,
# 文件系统不会被自动扩 —— systemd-repart 只扩分区,从不碰已存在分区的文件系统。
# 真正的文件系统扩容在运行时由 keel-firstboot / os-rescue 调用 systemd-growfs 完成。
