# keel:内核在**控制台**上只说「警告及以上」
#
# 为什么要这一条(2026-09,项目所有者实测):内核的 console_loglevel 出厂是 7
# (什么都印),而 keel 的 cmdline 里**刻意没有 `quiet`**(我们希望串口/图形控制台
# 上还能看到 systemd 的启动进度与致命错误)。两者相加的结果是:每一次 PAM 认证
# (登录、sudo、sshd)都会在图形控制台上打出 6~7 行 `audit: type=1100 …` 记录,
# 再加上 `kauditd_printk_skb: N callbacks suppressed` 的限流提示 —— 人坐在
# SPICE/物理控制台前会看到日志时不时刷一屏。
#
# 这一条把 console_loglevel 降到 4:emerg/alert/crit/err/**warning** 照旧上控制台,
# info/notice(以及那些 audit 记录)只进 dmesg 与 journal。
#   * `dmesg` 与 `journalctl` **一条都不会少**(实测:控制台 audit 增量 0,而
#     dmesg/journal 里同一次登录的 119 条 audit 记录都在);
#   * systemd 自己往 /dev/console 写的启动进度(`[  OK  ] Reached target …`)
#     不受影响 —— 那是 systemd 的输出,不走 printk;
#   * 想临时恢复"什么都印":`sudo sysctl -w kernel.printk="7 4 1 7"`(不用重启,
#     下次启动仍按这个文件来)。
#
# 为什么不用 cmdline 的 `quiet`:那条会把 systemd 的启动进度也一起按掉,而 UKI 里的
# cmdline 是**烧死的**(坑 #4,引导菜单里改不了)—— 想调回来只能重新构建。
# 用 sysctl 则随时可调,而且每台机器可以用 /etc overlay 覆盖。
#
# 格式:console_loglevel  default_message_loglevel  minimum_console_loglevel  default_console_loglevel
kernel.printk = 4 4 1 7
