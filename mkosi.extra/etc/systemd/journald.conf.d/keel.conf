# keel:日志的磁盘预算(决策 D23)
#
# 为什么必须显式写:journald 的默认值是"按文件系统百分比算"的 ——
# SystemMaxUse 默认 10%(封顶 4 GiB)、SystemKeepFree 默认 15%(封顶 4 GiB)。
# 在 /data 是"整盘剩余空间"的机器上,那意味着日志能自己长到 4 GiB,而且这个数字
# 随盘的大小漂移。我们要的是可预测的绝对上限。
#
# 为什么这件事重要:/data 写满 = **/etc 也写不进去**(overlay 的 upper 在同一个
# 文件系统上),machine-id 固化、SSH 主机密钥、sysusers/tmpfiles 会一起失败 ——
# 坑 #37 已经吃过一次(当时是 swapfile 干的)。
[Journal]
# 持久化到 /data(/var 是指向 /data 的符号链接),换槽/更新都不丢
Storage=persistent
SystemMaxUse=256M
# 给别的消费者留出余量:低于这个空闲量时 journald 自己开始回收
SystemKeepFree=2G
# 再老的日志即使没到 256M 也清掉,免得"很久以前的一次故障"永远占着空间
MaxRetentionSec=1month
