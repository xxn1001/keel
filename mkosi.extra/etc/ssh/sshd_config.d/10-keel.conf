# keel:SSH 只允许 admin(决策 D21)
#
# root 在镜像里是**锁定**的(/etc/shadow 里是 `!`),凭密码和密钥都登不进来;
# 这里再显式关一道,是为了防止"哪天有人给 root 设了密码"这件事悄悄把 SSH 打开。
#
# 生效前提:主配置 /etc/ssh/sshd_config 里有 `Include /etc/ssh/sshd_config.d/*.conf`
# (Debian 13 的默认配置在文件开头就有)。mkosi.postinst 会检查并在缺失时补上 ——
# sshd_config 是"第一条匹配生效",所以那一行必须在文件最前面,不能追加在末尾。
PermitRootLogin no
