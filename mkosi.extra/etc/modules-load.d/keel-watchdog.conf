# keel:没有硬件看门狗的设备上,用内核自带的软件看门狗顶上(决策 D25)
#
# 不少笔记本不把 iTCO/硬件看门狗暴露给 Linux(/dev/watchdog 不存在),那样上面那份
# RuntimeWatchdogSec= 就只是打一条警告。softdog 是内核自己的定时器看门狗:打开它、
# 定时喂;喂不到就复位。它由 PID1 打开(和硬件看门狗同一条路径),所以"PID1 冻住"这种
# 故障它同样能救。
#
# 注意:initrd 里没有这个模块(mkosi 的 initrd 只带必要模块)⇒ initrd 阶段的挂死仍然
# 依赖**硬件/virtio 看门狗**(QEMU 里有;部分真机没有)。这条已知限制记在 docs/roadmap.md。
softdog
