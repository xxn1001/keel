# keel:上游 nix 的构建用户(v1.2 B1 / 决策 D29)。
#
# 这里用 systemd-sysusers 声明,而不是像 Debian 的 nix-setup-systemd 那样在 postinst 里
# useradd(roadmap §3.5 的方向:基底系统账号尽量由 sysusers.d 声明)。
# 数目与 uid 起点跟上游 installer 一致(默认 32 个、从 30001 开始),这样多用户构建的
# build-users-group=nixbld 语义与上游文档一致。

g nixbld 30000
u! nixbld1 30001 "Nix build user 1" / /usr/sbin/nologin
