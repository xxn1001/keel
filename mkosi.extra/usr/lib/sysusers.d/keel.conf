# keel:唯一的交互登录账号(决策 D21)
#
# 为什么用 sysusers.d 而不是 useradd:
#   * 声明式、幂等 —— mkosi 构建时会跑 systemd-sysusers(在 finalize 之前),
#     每次构建结果一致,不依赖"某个人手工建的账号";
#   * 账号写在**镜像的 /etc/passwd**(只读 lower)里 ⇒ 即使 /data 坏了、/home 是空的,
#     控制台照样能以 admin 登录(只是没有家目录),root 则完全锁定 ——
#     这是"锁死 root"这件事的安全垫(没有它,/data 一坏就谁都进不去了)。
#
# uid 1000 是 Debian 上第一个普通用户的惯用值;home 在 /data/home/admin(/home 是
# /data/home 的 bind mount,见不变量 1)。
u admin 1000 "Keel Admin" /home/admin /bin/bash

# sudo 组:Debian 自带的 /etc/sudoers 里就有 `%sudo ALL=(ALL:ALL) ALL`,
# 但 sudo 包**不负责**创建这个组,所以这里显式建(系统组,- = 自动分配)。
g sudo -

# 密码由 mkosi 的 -p / mkosi.rootpw 决定,见 mkosi.finalize:
# 构建时把 root 的哈希搬给 admin,然后把 root 锁掉(mkosi.finalize 里做)。
m admin sudo
