# 首启/每次启动扩容 volume 用的定义
#
# 由 keel-firstboot 显式调用,刻意放在 /usr/lib/keel/repart.d/ 而**不是**全局的
# /usr/lib/repart.d/:后者会被 systemd-repart.service 在每次启动时无条件使用,
# 用一份不该它管的分区定义去动分区表是危险的。
#
# 类型必须和安装镜像里的 volume 完全一致。正因为它是项目私有 UUID,
# repart 才会唯一匹配到 volume,而不是误配到同为 linux-generic 的 root-b
# (repart 是按**类型**把现有分区匹配到定义的,见 mkosi.repart/30-volume.conf 的说明)。
[Partition]
Type=d605065b-64f9-4a07-a0b8-70963175c6e6
Label=volume
Format=ext4
GrowFileSystem=yes
SizeMinBytes=1G
# 刻意不写 GrowFileSystem=:它不是 DPS 类型,repart 会直接忽略并打印
# "… that doesn't support it, ignoring."。扩文件系统由调用方做完 repart 之后
# 再执行 systemd-growfs /Volume 完成(见 AGENTS.md 已知的坑 #14)。
