# keel:initrd 里的软件看门狗兜底(决策 D25 / 坑 #50)
#
# 不少设备不把硬件看门狗暴露给 Linux(/dev/watchdog 不存在),那样上面那份
# RuntimeWatchdogSec= 就只是打一条警告。softdog 是内核自带的定时器看门狗:
# 由 PID1 打开、定时喂;喂不到就复位 —— initrd 阶段 PID1 冻住时同样能救。
#
# 内核模块 initrd 里本来就有 softdog.ko(实测 6.12.107+deb13-amd64);这份
# modules-load.d 让 initrd 的 systemd 在早期把它加载出来。
softdog
