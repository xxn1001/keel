# keel:initrd 阶段的运行时看门狗(决策 D25 / 坑 #50;v1.2 3.0 起**真的进 initrd 了**)
#
# 为什么必须有它:「自动回滚」依赖「候选槽那次启动失败之后,机器**还会再启动**」。
# 失败分两类,覆盖它们的机制完全不同:
#   * **panic**(内核/initrd 里的 panic)⇒ cmdline 的 panic=-1 让它立即重启(决策 D24);
#   * **挂住**(卡死、冻结、等一个永远不来的东西)⇒ 没有任何代码会跑,**只能靠看门狗复位**。
# 2026-09 演练实测了第二类:候选槽的根镜像坏掉时,initrd 停在
#     [!!!!!!] Switch root target contains no usable init.
# 然后 systemd **冻结执行**(不 panic、不重启),机器就停在那里 —— 回退永远不会发生。
#
# 机制:PID1 每 RuntimeWatchdogSec/2 喂一次 /dev/watchdog;PID1 自己冻住(或用户态整体卡死)
# ⇒ 到点复位 ⇒ 下次启动引导器走持久默认(旧槽)⇒ keel-confirm 判定「更新失败已回滚」。
#
# 60 秒:正常启动的早期阶段远用不到这么久(不会误复位),而卡住时人只需要等一分钟。
# RebootWatchdogSec:关机流程卡住时也复位,避免「重启命令发出去了但机器没动」。
#
# ⚠ 这份文件与主镜像的 mkosi.extra/etc/systemd/system.conf.d/keel-watchdog.conf 必须同值
#   (主镜像那份管主系统 PID1,这份管 initrd PID1 —— initrd **不读**主镜像的 /etc)。
#   tools/verify.sh 会核对两边一致。
#
# ⚠ 交付路径(v1.2 3.0 实测):mkosi 25.3 往**默认 initrd** 里放文件只有两条路 ——
#   * `Initrds=` 是**替换**不是追加:一旦设了,内置 initrd 整个不进来,UKI 里只剩你给的
#     那几个文件 ⇒ 内核 `VFS: Unable to mount root fs`(坑 #77 的真实根因,别再用它);
#   * `InitrdPackages=` 是唯一能"追加"的口子,于是这份文件由 tools/initrd-watchdog-pkg.sh
#     打成 keel-initrd-watchdog 小包,由 mkosi 装进默认 initrd(见 mkosi.conf.d/20-packages.conf)。
#   softdog.ko 本来就在 initrd 的模块段里(实测 6.12.107+deb13-amd64),systemd-modules-load.service
#   也在 sysinit.target.wants 里 —— 缺的一直只是这两个配置文件。
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=10min
