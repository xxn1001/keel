# B 槽载荷的根分区
#
# 类型与安装镜像里的 B 槽保持一致(linux-generic,不是 root 类型),
# 标签必须是 root-b:UKI 的 cmdline 里写的是 root=PARTLABEL=root-b。
#
# 同 slot-a:erofs + Minimize=yes、不写 SizeMaxBytes ⇒ 载荷只占内容大小;
# 与安装镜像里那个 6 GiB 的 root-b 分区**同名即可**,尺寸不必相同。
[Partition]
Type=linux-generic
Format=erofs
Label=root-b
CopyFiles=/
Minimize=yes
SizeMinBytes=64M
SplitName=root-b
