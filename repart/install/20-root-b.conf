# B 槽(空槽)
#
# 刻意用 Type=linux-generic 而不是 root 类型:镜像里同时存在两个 root 类型分区
# 会让 mkosi 的"哪个是 root 分区"判定产生歧义(见 docs/traps.md 坑 #6)。
# 槽的身份只靠 PARTLABEL=root-b,更新时往这个分区写新版本。
#
# 安装镜像里就把这个槽建好(空槽),代价是镜像大 6 GiB,
# 换来的是装完立刻能测试槽切换,不需要任何分区手术(docs/architecture.md §3.2)。
#
# v1.1:**刻意不写 Format=** —— 这个槽是空的,而 systemd-repart 拒绝格式化一个
# 没有源文件的 erofs:
#     Cannot format erofs filesystem without source files, refusing.
# v1 能写 `Format=ext4`(空 ext4 是合法的),erofs 不行。
# 留成**未格式化**反而更好:第一次 os-update 把 erofs 镜像 dd 进来时,
# 分区里没有任何旧文件系统签名,内核/udev 的探测不会有歧义。
# (老机器上这个槽是 v1 建的 ext4 ⇒ 那条路要单独验,见 docs/roadmap.md §2.9 验证 3。)
#
# 尺寸仍是布局常量,与 A 槽一样保持 6 GiB。
[Partition]
Type=linux-generic
Label=root-b
SizeMinBytes=6G
SizeMaxBytes=6G
SplitName=root-b
