# A 槽根分区
#
# Type=root-x86-64 让它成为 mkosi 眼中的"root 分区"(root=PARTUUID 替换、
# 将来的 verity roothash 注入都针对它)。B 槽刻意**不用** root 类型,见 20-root-b.conf。
#
# 尺寸是布局常量:GPT 分区不能在中间插入或搬移,装机之后改这个数字只能重装。
# 6 GiB 是给 desktop profile 和未来增长留的余量(main 自己只用 1.5–2 GB)。
[Partition]
Type=root-x86-64
Format=ext4
Label=root-a
CopyFiles=/
SizeMinBytes=6G
SizeMaxBytes=6G
# SplitArtifacts=partitions 只对声明了 SplitName 的分区吐独立镜像文件,
# 产物名形如 keel.root-a.raw
SplitName=root-a
