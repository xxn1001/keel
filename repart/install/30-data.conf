# /data:唯一的分区级可写状态
#
# 分区类型刻意用一个**项目私有 UUID**,而不是 Discoverable Partitions 里的
# linux-generic。两个原因:
#   1. 首启扩容要往目标盘跑一次 systemd-repart,而 repart 是按**类型**把现有分区
#      匹配到定义的 —— 如果 data 分区也是 linux-generic,它会和同样是 linux-generic
#      的 root-b 撞车,可能扩错分区;
#   2. systemd-gpt-auto-generator 不会去碰它(我们靠 cmdline 的
#      cmdline 的 systemd.mount-extra=PARTLABEL=data 显式挂载;现在是 keel-mounts 自己扫 PARTNAME)。
#
# 骨架来自镜像里的 /usr/share/keel/data-skeleton,由 mkosi.finalize 生成
# (镜像自己的 /var 快照 + 补齐的必要目录,见 docs/architecture.md §4.2)。
[Partition]
Type=d605065b-64f9-4a07-a0b8-70963175c6e6
Format=ext4
Label=data
CopyFiles=/usr/share/keel/data-skeleton:/
SizeMinBytes=1G
# 不设 SizeMaxBytes ⇒ 在目标盘上占满剩余空间
# 刻意**不**写 GrowFileSystem=yes:
# 它不是 DPS 类型,repart 会打印
#   "Configured GrowFileSystem=yes for partition type 'd605065b-…' that doesn't support it, ignoring."
# 然后忽略它 —— 也就是说这个设置对我们的私有类型完全无效,只会让每次构建多一行像个警告的输出。
# 真正扩文件系统的是运行时的 systemd-growfs(keel-firstboot / os-rescue 都会调),
# 见 AGENTS.md 已知的坑 #14。
