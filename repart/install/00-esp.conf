# ESP:systemd-boot + 两个槽的 UKI
#
# 分区名 = 文件名去掉数字前缀 ⇒ PARTLABEL=esp,
# cmdline 里的 systemd.mount-extra=PARTLABEL=esp:/efi:vfat:ro 就靠它定位。
# Label= 同时决定 GPT 分区名与文件系统标签(已在本机用 systemd-repart 实测确认)。
[Partition]
Type=esp
Format=vfat
Label=esp
# 把镜像树里的 /boot 内容整体放到 ESP 根:
#   /boot/EFI/Linux/keel-a.efi → ESP/EFI/Linux/keel-a.efi
#   /boot/EFI/systemd/…        → ESP/EFI/systemd/…
#   /boot/loader/loader.conf   → ESP/loader/loader.conf
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=1G
SizeMaxBytes=1G
