# A 槽载荷的根分区
#
# v1.1 起根是 **erofs**(结构上不可写 + 压缩)。载荷只占内容大小:Minimize=yes
# 让 systemd-repart 先试算最小尺寸,所以这里**刻意不写 SizeMaxBytes** —— 写了就
# 会把载荷重新钉死成 6 GiB(v1 就是这么写的,一份载荷 6 GiB)。
#
# 尺寸不必和安装镜像里的 root-a 相同,**只需要同名(Label=root-a)**:
# os-update 把这个镜像 dd 进装机时建好的 6 GiB 分区,镜像小、分区大没有关系
# (erofs 的大小写在超级块里,分区尾部的旧字节不会被读)。
[Partition]
Type=root-x86-64
Format=erofs
Label=root-a
CopyFiles=/
Minimize=yes
SizeMinBytes=64M
SplitName=root-a
